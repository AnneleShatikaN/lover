<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>For My Valentine ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
        }
        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ffb3c1 100%);
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #d6336c;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            text-align: center;
            z-index: 5;
            white-space: nowrap;
        }
        #chocolate-debt {
            position: fixed;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            color: #8b4513;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            display: none;
            text-align: center;
            z-index: 5;
            white-space: nowrap;
        }
        #message-overlay {
            position: fixed;
            top: 35%;
            width: 100%;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #ff006e;
            text-shadow: 3px 3px 0px white, -1px -1px 0px white;
            display: none;
            pointer-events: none;
            animation: pulse 1s infinite;
            z-index: 5;
            padding: 0 20px;
        }
        #emoji-popup {
            position: fixed;
            font-size: 35px;
            pointer-events: none;
            display: none;
            animation: fadeFloat 1s ease-out forwards;
            z-index: 6;
        }
        #final-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            padding: 20px;
            overflow-y: auto;
        }
        #final-screen h1 {
            color: #ff006e;
            font-size: 48px;
            margin: 10px 0;
        }
        #final-screen p {
            font-size: 22px;
            color: #333;
            margin: 10px 0;
        }
        #final-screen .chocolate-line {
            font-size: 24px;
            color: #8b4513;
            font-weight: bold;
            margin: 20px 0;
        }

        @media (max-width: 400px) {
            #final-screen h1 {
                font-size: 38px;
            }
            #final-screen p {
                font-size: 18px;
            }
            #final-screen .chocolate-line {
                font-size: 20px;
            }
            #message-overlay {
                font-size: 28px;
            }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes fadeFloat {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
    </style>
</head>
<body>

<div id="ui">Hearts: 0/30</div>
<div id="chocolate-debt">Ferrero Rochers owed: 0 🍫</div>
<div id="message-overlay">WILL YOU BE<br>MY VALENTINE? 💕</div>
<div id="emoji-popup"></div>

<div id="final-screen">
    <h1>YESSS! 💖✨</h1>
    <p>You said YES!</p>
    <p class="chocolate-line" id="chocolate-total"></p>
    <p style="font-size: 18px; color: #666;">(Screenshot this and send it to me)</p>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    const chocolateUI = document.getElementById('chocolate-debt');
    const msgOverlay = document.getElementById('message-overlay');
    const emojiPopup = document.getElementById('emoji-popup');
    const finalScreen = document.getElementById('final-screen');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Handle window resize for responsive gameplay
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Reposition player if needed
        if (player.x > canvas.width) player.x = canvas.width / 2;
        if (player.targetX > canvas.width) player.targetX = canvas.width / 2;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);

    // EMOJIS
    const PLAYER_EMOJI = "🧸";
    const HEART_EMOJI = "❤️";
    const BROKEN_HEART_EMOJI = "💔";
    const GOLDEN_HEART_EMOJI = "💛"; // Bonus hearts worth 2 points
    const SPEED_BOOST_EMOJI = "⚡"; // Temporary speed boost

    // Game State
    let score = 0;
    let yesCollected = 0;
    let noCollected = 0; // Track NOs for chocolate debt
    let gamePhase = 1;
    let gameOver = false;
    let frame = 0;
    let playerSpeed = 1; // Movement responsiveness
    let speedBoostActive = false;

    // Difficulty scaling
    let phase1SpeedMultiplier = 1;
    let phase2SpeedMultiplier = 1;
    let phase1SpawnRate = 1;
    let phase2SpawnRate = 1;

    // Player
    const player = {
        x: canvas.width / 2,
        y: canvas.height - 80,
        targetX: canvas.width / 2,
        size: 50,
        draw: function() {
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = "center";
            ctx.fillText(PLAYER_EMOJI, this.x, this.y);
        },
        update: function() {
            // Smooth movement toward target
            let speed = speedBoostActive ? 0.3 : 0.15;
            this.x += (this.targetX - this.x) * speed;
        }
    };

    let items = [];

    class Item {
        constructor(type) {
            this.x = Math.random() * (canvas.width - 60) + 30;
            this.y = -50;
            this.type = type;
            this.size = 40;

            // Phase 1 speeds (much faster base speeds!)
            if (gamePhase === 1) {
                if (type === 'heart') {
                    this.speed = (Math.random() * 5 + 6) * phase1SpeedMultiplier; // 6-11 base (was 3-7)
                } else if (type === 'broken') {
                    this.speed = (Math.random() * 6 + 7) * phase1SpeedMultiplier; // 7-13 base (was 4-9)
                } else if (type === 'golden') {
                    this.speed = (Math.random() * 7 + 8) * phase1SpeedMultiplier; // 8-15 base (was 5-11)
                } else if (type === 'speed') {
                    this.speed = (Math.random() * 4 + 5) * phase1SpeedMultiplier; // 5-9 base
                }
            }

            // Phase 2: YES and NO mechanics (faster!)
            if (gamePhase === 2) {
                if (type === 'yes') {
                    this.speed = (Math.random() * 5 + 7) * phase2SpeedMultiplier; // 7-12 base (was 5-9)
                    this.wiggle = Math.random() * 0.1 + 0.05; // Zigzag
                } else if (type === 'no') {
                    this.speed = (Math.random() * 6 + 8) * phase2SpeedMultiplier; // 8-14 base (was 6-9)
                    this.chaseMode = Math.random() > 0.5; // 50% chase player
                    this.size = 50; // Bigger = more threatening
                }
            }

            this.wobbleOffset = Math.random() * Math.PI * 2;
        }

        draw() {
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = "center";

            if(this.type === 'yes') {
                ctx.fillText("YES", this.x, this.y);
            } else if(this.type === 'no') {
                ctx.fillText("NO", this.x, this.y);
            } else if(this.type === 'heart') {
                ctx.fillText(HEART_EMOJI, this.x, this.y);
            } else if(this.type === 'broken') {
                ctx.fillText(BROKEN_HEART_EMOJI, this.x, this.y);
            } else if(this.type === 'golden') {
                ctx.fillText(GOLDEN_HEART_EMOJI, this.x, this.y);
            } else if(this.type === 'speed') {
                ctx.fillText(SPEED_BOOST_EMOJI, this.x, this.y);
            }
        }

        update() {
            this.y += this.speed;

            // YES items zigzag
            if (this.type === 'yes' && this.wiggle) {
                this.x += Math.sin(frame * this.wiggle + this.wobbleOffset) * 2;
            }

            // NO items chase player (some of them)
            if (this.type === 'no' && this.chaseMode) {
                let dx = player.x - this.x;
                this.x += dx * 0.02; // Slowly home in
            }

            // Keep items on screen horizontally
            if (this.x < 20) this.x = 20;
            if (this.x > canvas.width - 20) this.x = canvas.width - 20;

            // Collision
            const dist = Math.hypot(this.x - player.x, this.y - (player.y - 20));
            if (dist < player.size / 1.5) {
                return true;
            }
            return false;
        }
    }

    // CONTROLS
    function movePlayer(e) {
        e.preventDefault();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        player.targetX = clientX;

        if (player.targetX < 25) player.targetX = 25;
        if (player.targetX > canvas.width - 25) player.targetX = canvas.width - 25;
    }

    window.addEventListener('touchmove', movePlayer, { passive: false });
    window.addEventListener('mousemove', movePlayer);

    // GAME LOOP
    function loop() {
        if (gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        player.update();
        player.draw();

        // PHASE 1: Collect Hearts
        if (gamePhase === 1) {
            // Update difficulty every 5 hearts
            phase1SpeedMultiplier = 1 + (Math.floor(score / 5) * 0.15);
            phase1SpawnRate = 1 + (Math.floor(score / 5) * 0.3);

            // Spawn items - MANY more broken hearts than regular hearts!
            let baseHeartRate = Math.max(20, 35 - Math.floor(score / 5) * 2); // Hearts spawn less often
            let baseBrokenRate = Math.max(10, 18 - Math.floor(score / 5) * 1); // Broken hearts spawn MUCH more often

            if (frame % baseHeartRate === 0) {
                items.push(new Item('heart'));
            }
            if (frame % baseBrokenRate === 0) {
                items.push(new Item('broken'));
                // Spawn extra broken hearts frequently
                if (Math.random() > 0.5) {
                    items.push(new Item('broken'));
                }
            }
            // Even more broken hearts!
            if (frame % (baseBrokenRate + 5) === 0) {
                items.push(new Item('broken'));
            }

            if (frame % 120 === 0) items.push(new Item('golden')); // Rare golden heart
            if (frame % 180 === 0) items.push(new Item('speed')); // Rare speed boost

            if (score >= 30) {
                startPhaseTwo();
            }
        }

        // PHASE 2: The Question
        if (gamePhase === 2) {
            // Update difficulty every 3 YES
            phase2SpeedMultiplier = 1 + (Math.floor(yesCollected / 3) * 0.2);
            phase2SpawnRate = 1 + (Math.floor(yesCollected / 3) * 0.4);

            // Spawn YES and NO (rates increase with difficulty)
            let baseYesRate = Math.max(12, 25 - Math.floor(yesCollected / 3) * 3);
            let baseNoRate = Math.max(20, 35 - Math.floor(yesCollected / 3) * 3);

            if (frame % baseYesRate === 0) {
                items.push(new Item('yes'));
                if (phase2SpawnRate > 1.8 && Math.random() > 0.6) {
                    items.push(new Item('yes'));
                }
            }
            if (frame % baseNoRate === 0) {
                items.push(new Item('no'));
                if (phase2SpawnRate > 2 && Math.random() > 0.5) {
                    items.push(new Item('no'));
                }
            }

            // CHAOS MODE: If taking too long (15 seconds)
            if (frame > phaseTwoStartFrame + 900) {
                if (frame % 8 === 0) items.push(new Item('yes')); // YES rain
                if (frame % 15 === 0) items.push(new Item('no')); // More NOs too
            }
        }

        // Update items
        for (let i = 0; i < items.length; i++) {
            let hit = items[i].update();
            items[i].draw();

            if (hit) {
                handleHit(items[i]);
                items.splice(i, 1);
                i--;
            } else if (items[i].y > canvas.height + 50) {
                items.splice(i, 1);
                i--;
            }
        }

        ui.innerText = gamePhase === 1 ? `Hearts: ${score}/30` : `YES collected: ${yesCollected}/15`;
        frame++;
        requestAnimationFrame(loop);
    }

    let phaseTwoStartFrame = 0;

    function startPhaseTwo() {
        gamePhase = 2;
        phaseTwoStartFrame = frame;
        items = [];
        msgOverlay.style.display = "block";
        chocolateUI.style.display = "block";

        if (navigator.vibrate) navigator.vibrate(200);

        setTimeout(() => {
            msgOverlay.style.display = "none";
        }, 3500);
    }

    function handleHit(item) {
        if (gamePhase === 1) {
            if (item.type === 'heart') {
                score++;
                showEmojiPopup("💕", item.x, item.y);
            }
            if (item.type === 'golden') {
                score += 2;
                showEmojiPopup("✨", item.x, item.y);
                if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            }
            if (item.type === 'broken') {
                score = Math.max(0, score - 1);
                shakeScreen();
                showEmojiPopup("😢", item.x, item.y);
            }
            if (item.type === 'speed') {
                activateSpeedBoost();
                showEmojiPopup("🚀", item.x, item.y);
            }
        }
        else if (gamePhase === 2) {
            if (item.type === 'yes') {
                yesCollected++;
                showEmojiPopup("😍", item.x, item.y);
                if (yesCollected >= 15) winGame();
            }
            if (item.type === 'no') {
                yesCollected = Math.max(0, yesCollected - 1);
                noCollected++;
                updateChocolateDebt();
                shakeScreen();

                // Show random reaction emoji
                const reactions = ["😐", "🤨", "😑"];
                showEmojiPopup(reactions[Math.floor(Math.random() * reactions.length)], item.x, item.y);

                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
            }
        }
    }

    function activateSpeedBoost() {
        speedBoostActive = true;
        player.size = 45; // Slightly smaller visual
        setTimeout(() => {
            speedBoostActive = false;
            player.size = 50;
        }, 5000);
    }

    function updateChocolateDebt() {
        chocolateUI.innerText = `Ferrero Rochers owed: ${noCollected} 🍫`;
    }

    function showEmojiPopup(emoji, x, y) {
        emojiPopup.innerText = emoji;
        emojiPopup.style.left = x + "px";
        emojiPopup.style.top = y + "px";
        emojiPopup.style.display = "block";

        setTimeout(() => {
            emojiPopup.style.display = "none";
        }, 1000);
    }

    function shakeScreen() {
        canvas.style.transform = "translate(6px, 6px)";
        setTimeout(() => canvas.style.transform = "translate(-6px, -6px)", 50);
        setTimeout(() => canvas.style.transform = "translate(6px, -6px)", 100);
        setTimeout(() => canvas.style.transform = "translate(-6px, 6px)", 150);
        setTimeout(() => canvas.style.transform = "translate(0, 0)", 200);
    }

    function winGame() {
        gameOver = true;
        let chocolateText = noCollected > 0
            ? `You owe me ${noCollected} Ferrero Rocher${noCollected > 1 ? 's' : ''} 🍫`
            : "No chocolates owed! (for now 😏)";

        document.getElementById('chocolate-total').innerText = chocolateText;
        finalScreen.style.display = "flex";

        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
    }

    loop();

</script>
</body>
</html>
